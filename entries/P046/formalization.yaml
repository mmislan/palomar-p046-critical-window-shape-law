    "name": "Effective approximation and low-intensity flatness of RAF critical-window profiles",
    "description": "The critical-window laws for autocatalytic emergence in reversible binary-polymer networks lead to survival profiles for independent open reaction channels. For both the ordered split-position and commuting-factor quotient models, with all binary words of length at most two as food, explicit total algorithms enclose each survival probability at every rational openness in [0,1] to any prescribed positive rational accuracy. Computable seed lengths and finite-record contraction estimates provide uniform truncation bounds on intervals bounded away from zero. The associated intensity profiles S(1 − exp(−λ)) are smaller than every fixed power of λ as λ tends to zero from above. Rational interval bounds also compare these profiles with finite-network RAF-existence probabilities under explicit catalyst-pool and input-probability conditions. These results extend the split and quotient critical-window laws with certified approximation and quantitative control.",
